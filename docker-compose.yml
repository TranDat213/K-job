services:
  postgres:
    image: postgres:16-alpine
    container_name: koc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koc_password}
      POSTGRES_DB: ${POSTGRES_DB:-koc_manager}
    ports:
      - '${POSTGRES_PORT:-5334}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-koc_user} -d ${POSTGRES_DB:-koc_manager}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
